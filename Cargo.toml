[package]
name = "crime"
description = "Concurrent real-time interface for multimedia engines"
homepage = "https://github.com/rimelabs/crime"
repository = "https://github.com/rimelabs/crime"
version = "0.6.1"
edition = "2024"
license = "LGPL-2.1-or-later"
readme = "README.md"

[features]
default = []
pcm = ["dep:audio-codec-algorithms", "dep:half"]
wav = ["dep:half"]
mp3 = ["dep:mp3lame-encoder"]
ogg = ["dep:opus", "dep:ogg", "dep:crc"]
webm = ["dep:opus"]

[dependencies]
async-stream = "0.3.6"
audio-codec-algorithms = { version = "0.7.0", optional = true }
crc = { version = "3.4.0", optional = true }
futures = "0.3.31"
half = { version = "2.6.0", optional = true }
mp3lame-encoder = { version = "0.2.1", optional = true }
ogg = { version = "0.9.2", optional = true }
opus = { version = "0.4.0", optional = true }
realfft = "3.5.0"
audioadapter-buffers = "2"
rubato = "1"

[[example]]
name = "sine_wav"
required-features = ["wav"]
